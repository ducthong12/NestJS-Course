type User {
  id: ID!
  name: String!
  email: String!
  role: String!
  posts: [Post]
  profile: Profile
}

type Post {
  id: ID!
  title: String!
  content: String
  published: Boolean!
  viewCount: Int!
  author: User
}

type Profile {
  id: ID!
  bio: String!
  user: User
}

type Query {
  users: [User]
  user(id: ID!): User
  posts: [Post]
  post(id: ID!): Post
  profile(id: ID!): Profile
}

type Mutation {
  increaseViewCount(postId: ID!): Post
  addPost(post: AddPostInput): Post!
  deletePost(postId: ID!): Post
  updatePost(postId: ID!, editPost: EditPostInput!): Post
}

input AddPostInput {
  title: String!
  content: String
  authorId: ID!
}

input EditPostInput {
  title: String
  content: String
  authorId: ID
}
